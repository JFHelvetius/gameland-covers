<svg xmlns="http://www.w3.org/2000/svg" width="264" height="374" viewBox="0 0 264 374">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B8B23" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B8B23" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B8B23" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#8B8B23" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B8B23" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="264" height="374" rx="6"/></clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="264" height="374" fill="#0a0a14" rx="6"/>
  <rect width="264" height="374" fill="url(#g1)" rx="6"/>
  <ellipse cx="132" cy="168" rx="120" ry="110" fill="url(#glow)"/>

  <!-- Franja superior -->
  <rect x="0" y="0" width="264" height="58" fill="url(#g2)" clip-path="url(#clip)"/>

  <!-- Líneas decorativas horizontales (cinta de cartucho) -->
  <line x1="0" y1="58" x2="264" y2="58" stroke="#8B8B23" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="0" y1="61" x2="264" y2="61" stroke="#8B8B23" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Etiqueta del sistema -->
  <text x="132" y="38" font-family="Arial,Helvetica,sans-serif" font-size="13"
        font-weight="900" fill="#8B8B23" text-anchor="middle" letter-spacing="5"
        opacity="0.95">GB</text>

  <!-- Marco central redondeado -->
  <rect x="22" y="78" width="220" height="218" rx="8"
        fill="#8B8B23" fill-opacity="0.07"
        stroke="#8B8B23" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Icono de cartucho (silueta abstracta) -->
  <rect x="97" y="92" width="70" height="52" rx="4"
        fill="#8B8B23" fill-opacity="0.18" stroke="#8B8B23" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="109" y="98" width="16" height="6" rx="2" fill="#8B8B23" fill-opacity="0.5"/>
  <rect x="139" y="98" width="16" height="6" rx="2" fill="#8B8B23" fill-opacity="0.5"/>
  <rect x="109" y="108" width="46" height="3" rx="1.5" fill="#8B8B23" fill-opacity="0.3"/>
  <rect x="109" y="114" width="30" height="3" rx="1.5" fill="#8B8B23" fill-opacity="0.2"/>
  <rect x="109" y="120" width="38" height="3" rx="1.5" fill="#8B8B23" fill-opacity="0.2"/>

  <!-- Título del juego -->
  <text x="132" y="179" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Gameboy Gallery 2</text>
  <text x="132" y="201" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">(A)</text>
  

  <!-- Franja inferior -->
  <rect x="0" y="316" width="264" height="58" fill="#0a0a14" clip-path="url(#clip)"/>
  <line x1="0" y1="316" x2="264" y2="316" stroke="#8B8B23" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="0" y1="313" x2="264" y2="313" stroke="#8B8B23" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Logo Gameland inferior -->
  <text x="132" y="348" font-family="Arial,Helvetica,sans-serif" font-size="10"
        font-weight="700" fill="#8B8B23" text-anchor="middle"
        letter-spacing="4" opacity="0.55">GAMELAND</text>
</svg>